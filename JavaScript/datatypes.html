<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //data types
        // 1.Number - 0 to 9 , , , , e
        // 2.String - " ", ' ', ` `
        // 3.Boolean - true or false
        // 4.Null - null
        // 5.Undefined - undefined
        // 6.Symbol - Symbol('description')
        //7.Object - {key: value}; null,date,array, js object
        let a = 10; //number
        let b = "Hello"; //string
        let c = true; //boolean
        let d = null; //null
        let e; //undefined
        let g = {name:'ram'}; //object    
        let f = Symbol('description'); //symbol
        document.write("Number: " + a + "<br>");
        document.write("String: " + b + "<br>");    
        document.write("Boolean: " + c + "<br>");
        document.write("Null: " + d + "<br>");
        document.write("Undefined: " + e + "<br>");
        document.write("Symbol: " + f + "<br>");
        document.write("Object: " + g["name"] + "<br>");
        //let const var
        //let, var - variable(value can be changed)
        //const - constant(value cannot be changed)
        //let,const - cannot be redeclared
        //var - can be redeclared
        var x = 'something';
        //let,const - block scope
        //var - global scope
    </script>
    
</body>
</html>
