<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //operators
        //1.Arithmetic operators
        let a = 10;
        let b = 5;
        document.write("Addition: " + (a + b) + "<br>");
        document.write("Subtraction: " + (a - b) + "<br>");
        document.write("Multiplication: " + (a * b) + "<br>");
        document.write("Division: " + (a / b) + "<br>");
        document.write("Modulus: " + (a % b) + "<br>");
        document.write("Exponentiation: " + (a ** b) + "<br>");
        //2.Assignment operators
        let c = 10;
        c += 5; // c = c + 5
        document.write("Assignment Addition: " + c + "<br>");
        c -= 5; // c = c - 5
        document.write("Assignment Subtraction: " + c + "<br>");
        c *= 5; // c = c * 5
        document.write("Assignment Multiplication: " + c + "<br>");
        c /= 5; // c = c / 5
        document.write("Assignment Division: " + c + "<br>");
        c %= 5; // c = c % 5
        document.write("Assignment Modulus: " + c + "<br>");
    </script>
</body>
</html>
